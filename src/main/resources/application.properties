quarkus.http.port=${PORT:8081}

# --- Authentication Mechanisms ---
quarkus.http.auth.form.enabled=true
quarkus.http.auth.form.login-page=/login.html
quarkus.http.auth.form.error-page=/login.html?error=true
quarkus.http.auth.form.landing-page=/index.html

# --- Identity Provider (simple file-based) ---
quarkus.security.users.file.enabled=true
quarkus.security.users.file.users=users.properties
quarkus.security.users.file.roles=roles.properties
quarkus.security.users.file.plain-text=true

# --- Localhost auto-login (skip login page) ---
quarkus.http.auth.permission.localhost.paths=/*
quarkus.http.auth.permission.localhost.policy=permit
quarkus.http.auth.permission.localhost.methods=GET,POST
quarkus.http.auth.permission.localhost.remote-address=127.0.0.1

# --- Protect everything else ---
quarkus.http.auth.permission.protected.paths=/*
quarkus.http.auth.permission.protected.policy=authenticated

# --- Public static resources ---
quarkus.http.auth.permission.public-static.paths=/login.html,/index.html,/mystyle.css,/script.js,/favicon.ico
quarkus.http.auth.permission.public-static.policy=permit
quarkus.http.auth.permission.public-static.methods=GET

# --- Allow form submit ---
quarkus.http.auth.permission.public-auth.paths=/j_security_check
quarkus.http.auth.permission.public-auth.policy=permit
quarkus.http.auth.permission.public-auth.methods=POST
