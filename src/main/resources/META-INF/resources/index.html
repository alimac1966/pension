<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pension Forecast Calculator</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

<main class="container">
    <header>
        <h1>How long will your pension last</h1>
        <p class="subtitle">Welcome, Alistair. Use the tool below to run a detailed pension stress test.</p>
    </header>

    <section class="card">
        <h2 class="section-title">Stress Test Parameters</h2>
        <div class="input-grid">
            <div class="field">
                <label>Pension Balance</label>
                <input id="pensionBalance" type="number" step="0.01" value="466208.11">
            </div>
            <div class="field">
                <label>Growth Rate</label>
                <input id="growthRate" type="number" step="0.01" value="0.06">
            </div>
            <div class="field">
                <label>Inflation</label>
                <input id="inflation" type="number" step="0.01" value="0.03">
            </div>
            <div class="field">
                <label>Mortgage Balance</label>
                <input id="mortgageBalance" type="number" step="0.01" value="59514.31">
            </div>
            <div class="field">
                <label>Annual Spending</label>
                <input id="spending" type="number" step="0.01" value="30000">
            </div>
            <div class="field">
                <label>Savings</label>
                <input id="savings" type="number" step="0.01" value="14983.52">
            </div>
            <div class="field">
                <label>Tax Allowance</label>
                <input id="taxAllowance" type="number" step="0.01" value="12570">
            </div>
            <div class="field">
                <label>State Pension</label>
                <input id="statePension" type="number" step="0.01" value="12570">
            </div>
        </div>
        <button onclick="runStressTest()">Run Stress Test</button>
    </section>

    <section class="results-wrapper">
        <h2>Results</h2>
        <div class="table-container">
            <table>
                <thead>
                <tr>
                    <th>Age</th>
                    <th>Tax-Free</th>
                    <th>Taxable</th>
                    <th>Spending</th>
                    <th>Income (TF)</th>
                    <th>Income (Tax)</th>
                    <th>State Pension</th>
                    <th>Other</th>
                </tr>
                </thead>
                <tbody id="resultsTable"></tbody>
            </table>
        </div>
    </section>
</main>

<script src="script.js"></script>
</body>
</html>
