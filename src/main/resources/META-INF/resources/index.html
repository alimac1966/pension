<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pension Forecast Calculator</title>
    <link rel="stylesheet" href="mystyle.css">
</head>
<body>

<main class="container">
    <header>
        <h1>Financial Planning</h1> <p class="subtitle"> Explore your retirement position with pension projections, spending analysis and financial stress testing. </p>

    </header>
    <section class="navigation">
        <button onclick="showSection('spendingAnalysis')">Spending Analysis</button>
        <button onclick="showSection('pensionLongevity')">Pension Longevity</button>
        <button onclick="runStressTest()">Run Pension Projection</button>
    </section>
    <section class="card">
        <h2 class="section-title">Pension Parameters</h2>
        <div class="input-grid">
            <div class="field">
                <label>Pension Balance</label>
                <input id="pensionBalance" type="number" >
            </div>
            <div class="field">
                <label>Growth Rate</label>
                <input id="growthRate" type="number" >
            </div>
            <div class="field">
                <label>Inflation</label>
                <input id="inflation" type="number" >
            </div>
            <div class="field">
                <label>Mortgage Balance</label>
                <input id="mortgageBalance" type="number" >
            </div>
            <div class="field">
                <label>Annual Spending</label>
                <input id="spending" type="number" >
            </div>
            <div class="field">
                <label>Savings</label>
                <input id="savings" type="number" >
            </div>
            <div class="field">
                <label>Tax Allowance</label>
                <input id="taxAllowance" type="number" >
            </div>
            <div class="field">
                <label>State Pension</label>
                <input id="statePension" type="number" >
            </div>
        </div>
        
    </section>

    <section class="results-wrapper">
        <h2>Results</h2>
        <div class="table-container">
            <table>
                <thead>
                <tr>
                    <th>Age</th>
                    <th>Tax-Free</th>
                    <th>Taxable</th>
                    <th>Spending</th>
                    <th>Income (TF)</th>
                    <th>Income (Tax)</th>
                    <th>State Pension</th>
                    <th>Other</th>
                </tr>
                </thead>
                <tbody id="resultsTable"></tbody>
            </table>
        </div>
    </section>
</main>

<script src="script.js"></script>
</body>
</html>
