<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Two-pane layout</title>
<link rel="stylesheet" href="./mystyle.css">
</head>

<body>

<header>
  <h1 class="page-title">Financial Planning</h1>

  <div class="header-controls">
    <div class="group solo">
      <button class="clear" id="clear-all">Home</button>
    </div>

    <div class="group" data-tone="upper">

      <button data-pane="upper" data-view="users">Spending Analysis</button>
      <button data-pane="upper" data-view="notes">Pension Longevity</button>
      <button data-pane="upper" data-view="log">Pension Projection</button>
    </div>


  </div>
</header>

<main>
  <section class="panel" id="upper-panel">
    <div class="panel-head">Upper</div>
    <div id="upper" class="pane" aria-label="Upper pane"></div>
  </section>

  <div id="divider" role="separator" aria-orientation="horizontal" tabindex="0"
       aria-label="Resize panes (drag, or use the up and down arrow keys)"></div>

  <section class="panel" id="lower-panel">
    <div class="panel-head">Lower</div>
    <div id="lower" class="pane" aria-label="Lower pane"></div>
  </section>
</main>

<script src="./script.js"></script>
</body>
</html>
